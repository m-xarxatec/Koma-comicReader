<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Iconos de la maqueta (trazos sin relleno: el color y el grosor los pone la clase .icon de base.css).
       Uso: <svg class="icon" aria-hidden="true"><use href="/icons/sprite.svg#icon-home"/></svg>
       Solo los que usa alguna página; cada bloque añade los suyos. -->
  <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 10.3 12 3l9 7.3V21h-6v-6H9v6H3z"/></symbol>
  <symbol id="icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.6 8.4-2.4 4.8-4.8 2.4 2.4-4.8z"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
  <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.4"/><path d="M20 4v7h-7"/></symbol>
</svg>
