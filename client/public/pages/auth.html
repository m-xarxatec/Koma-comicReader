<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="request-id" content="{{requestId}}">
  <title>{{title}} · Koma</title>
  <link rel="icon" href="/icons/favicon.svg">
  <link rel="stylesheet" href="/styles/variables.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/components/site-header.css">
  <link rel="stylesheet" href="/styles/components/site-footer.css">
  <link rel="stylesheet" href="/styles/components/form.css">
  <link rel="stylesheet" href="/styles/components/auth.css">
  <script type="module" src="/js/pages/auth.js"></script>
</head>
<body data-mode="{{mode}}">
  <!-- @header -->
  <main id="contenido" class="page auth">
    <h1>{{heading}}</h1>
    <noscript>
      <p class="form__notice">Para entrar o crear una cuenta hay que activar JavaScript en el navegador.</p>
    </noscript>

    <!-- Entrar (CU-08). Los dos formularios están en la página; auth.css muestra el de data-mode. -->
    <form class="form auth__form auth__form--login" id="login-form" method="post" action="/api/auth/login">
      <div class="form__field">
        <label class="form__label" for="login-email">Correo</label>
        <input class="form__input" id="login-email" name="email" type="email" autocomplete="username" required maxlength="254" aria-describedby="login-email-error">
        <p class="form__error" id="login-email-error" hidden></p>
      </div>
      <div class="form__field">
        <label class="form__label" for="login-password">Contraseña</label>
        <input class="form__input" id="login-password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-password-error">
        <p class="form__error" id="login-password-error" hidden></p>
      </div>
      <p class="form__error form__error--form" data-form-error role="alert" hidden></p>
      <button class="form__submit" type="submit">Entrar</button>
      <p class="form__alt">¿No tienes cuenta? <a href="/registro" data-keep-next>Crea una</a></p>
    </form>

    <!-- Crear cuenta (CU-07 · RN-12) -->
    <form class="form auth__form auth__form--register" id="register-form" method="post" action="/api/auth/register">
      <div class="form__field">
        <label class="form__label" for="register-email">Correo</label>
        <input class="form__input" id="register-email" name="email" type="email" autocomplete="username" required maxlength="254" aria-describedby="register-email-error">
        <p class="form__error" id="register-email-error" hidden></p>
      </div>
      <div class="form__field">
        <label class="form__label" for="register-display-name">Nombre visible</label>
        <input class="form__input" id="register-display-name" name="displayName" type="text" autocomplete="nickname" required minlength="3" maxlength="30" aria-describedby="register-display-name-hint register-display-name-error">
        <p class="form__hint" id="register-display-name-hint">De 3 a 30 caracteres. Es el nombre que verán los demás.</p>
        <p class="form__error" id="register-display-name-error" hidden></p>
      </div>
      <div class="form__field">
        <label class="form__label" for="register-password">Contraseña</label>
        <input class="form__input" id="register-password" name="password" type="password" autocomplete="new-password" required minlength="10" aria-describedby="register-password-hint register-password-error">
        <p class="form__hint" id="register-password-hint">Al menos 10 caracteres.</p>
        <p class="form__error" id="register-password-error" hidden></p>
      </div>
      <p class="form__error form__error--form" data-form-error role="alert" hidden></p>
      <button class="form__submit" type="submit">Crear cuenta</button>
      <p class="form__alt">¿Ya tienes cuenta? <a href="/entrar" data-keep-next>Entra</a></p>
    </form>
  </main>
  <!-- @footer -->
</body>
</html>
